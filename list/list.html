            <ul>

                </li>

                <option value="Department of Chemical Engineering">Department of Chemical Engineering</option>
            </select>
            
        </fieldset>
        <fieldset>
            <legend>

            </legend>
            <input type="checkbox" name="hobbies" value="Football" />Football
            <input type="checkbox" name="hobbies" value="Cricket" />Cricket
        </fieldset>
        <fieldset>
            <legend>
                <h4>Doctor's Recommendation for Sports Participation</h4>
            </legend>
        </fieldset>
        <fieldset>

            </legend>
            <label for="Address"><strong>Address:</strong></label>
            <textarea id="Address" name="Address" rows="4" cols="50" placeholder="Enter your address here..."></textarea>
        </fieldset>
        
        <fieldset>

            <input type="file" id="excel document" name="excel document" accept=".xlsx" <br><br>   
        </fieldset>
