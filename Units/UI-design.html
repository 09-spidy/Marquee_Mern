<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style type="text/css">
      #div1 {
        border-radius: 10px;
      }
    </style>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    />
  </head>
  <body>
    <div
      style="
        height: 200px;
        width: 100%;
        float: left;
        background-color: blue;
        border-radius: 10px;
      "
    ></div>
    <div
      style="
        height: 400px;
        width: 100%;
        float: left;
        background-color: white;
        border-bottom-left-radius: 10px;
        border-bottom-right-radius: 10px;
      "
    >
      <div style="height: 100px; width: 100%; float: left">
        <center>
          <h3>Coding Lab</h3>
          <p>Youtuber & Blogger</p>
        </center>
      </div>
      <div style="height: 100px; width: 100%; float: left">
        <center>
          <i class="fa-brands fa-facebook"></i>
          <i class="fa-brands fa-x-twitter"></i>
          <i class="fa-brands fa-instagram"></i>
          <i class="fa-brands fa-youtube"></i>
        </center>
      </div>
      <div style="height: 100px; width: 100%; float: left">
        <center>
          <button
            style="
              border-radius: 40%;
              background-color: dodgerblue;
              color: white;
            "
          >
            Subscribe
          </button>
          <button
            style="
              border-radius: 40%;
              background-color: dodgerblue;
              color: white;
            "
          >
            Message
          </button>
        </center>
      </div>
      <div style="height: 100px; width: 100%; float: left">
        <center>
          <i class="fa-regular fa-heart"> 60.4k</i>

          <i class="fa-regular fa-comment">20k</i>

          <i class="fa-solid fa-reply">12.4k</i>
        </center>
      </div>
    </div>
  </body>
</html>
